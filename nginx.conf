worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       C:/nginx-1.30.2/conf/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Define upstream Node.js load-balanced server pool
    # Default algorithm: Round Robin (requests cycle evenly across servers 3000 -> 3001 -> 3002)
    upstream nodejs_backend {
        # Uncomment one of the following to change the load-balancing algorithm:
        # least_conn;   # Sends requests to the server with the fewest active connections
        # ip_hash;      # Routes the same client IP to the same backend server (sticky sessions)

        server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:3002 max_fails=3 fail_timeout=10s;
    }

    server {
        listen       8088;
        server_name  localhost;

        # Reverse proxy and load balance all requests across nodejs_backend
        location / {
            proxy_pass         http://nodejs_backend;
            proxy_http_version 1.1;

            # Try the next upstream server automatically if one instance is down
            proxy_next_upstream error timeout http_502 http_503 http_504;

            # Forward client information headers to Express
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Support WebSocket / keep-alive connections
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_cache_bypass $http_upgrade;

            # Proxy timeouts
            proxy_connect_timeout 5s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }
    }
}
